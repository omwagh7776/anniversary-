<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 1st Anniversary 💞</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#3b0a1e;--bg2:#6b1233;--gold:#f3c969;--rose:#ff8fa8;--ink:#fff4ec;--card:#fff9f3;--text:#4a1a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:Poppins,'Noto Sans Devanagari',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,.serif{font-family:'Playfair Display','Noto Serif Devanagari',Georgia,serif}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-40px;animation:up linear forwards;opacity:.7}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);transition:opacity .8s,visibility .8s;text-align:center;padding:24px}
#gate.off{opacity:0;visibility:hidden}
#gate .big{font-size:84px;animation:beat 1.3s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
button{font:500 16px Poppins,'Noto Sans Devanagari',sans-serif;background:var(--gold);color:var(--bg);border:0;border-radius:99px;padding:14px 34px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:56px 20px 80px;text-align:center}
.one{font-family:'Playfair Display','Noto Serif Devanagari',Georgia,serif;font-size:min(46vw,210px);line-height:1;color:var(--gold);text-shadow:0 0 40px #f3c96966}
h1{font-size:clamp(30px,8vw,56px);line-height:1.15;min-height:2.4em;margin-top:6px}
.cur::after{content:'|';animation:bl .8s steps(1) infinite;color:var(--gold)}
@keyframes bl{50%{opacity:0}}
.names{font-family:'Playfair Display','Noto Serif Devanagari',Georgia,serif;font-style:italic;font-size:clamp(22px,5vw,32px);color:var(--rose);margin-top:14px}
.date{margin-top:10px;opacity:.85;letter-spacing:.04em}
.msg{white-space:pre-line;margin:40px auto 0;max-width:34em;line-height:1.8;opacity:0;transition:opacity 1.5s}
.msg.on{opacity:1}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 18px;margin-top:56px}
.pol{background:var(--card);padding:10px 10px 38px;border-radius:4px;color:var(--text);transform:rotate(var(--r)) translateY(60px);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.3,1.2),opacity .9s;box-shadow:0 14px 30px #0006;position:relative}
.pol.in{transform:rotate(var(--r));opacity:1}
.pol:hover{transform:rotate(0) scale(1.06);z-index:2}
.pol .ph{aspect-ratio:4/5;border-radius:2px;background:linear-gradient(135deg,#ffb3c4,#f3c969);display:grid;place-items:center;font-size:34px;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.pol small{position:absolute;bottom:10px;left:0;right:0;font-family:'Playfair Display','Noto Serif Devanagari',Georgia,serif;font-style:italic;font-size:15px}
.foot{margin-top:64px;font-size:22px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
@media(prefers-reduced-motion:reduce){.h,#gate .big{animation:none}.pol{transition:none}}


.heart{width:min(84vw,400px);aspect-ratio:32/29.6;margin:0 auto 10px;position:relative;filter:drop-shadow(0 0 22px #ff8fa8aa) drop-shadow(0 0 60px #f3c96966);transform:scale(0);opacity:0}
.heart.on{animation:pop 1.3s cubic-bezier(.2,1.4,.4,1) forwards,hb 1.6s 1.3s infinite ease-in-out}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.mask{position:absolute;inset:0;overflow:hidden;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 29.6'><path d='M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 29.6'><path d='M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z'/></svg>") center/contain no-repeat}
.mask img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:0;transition:opacity 1.2s;transform:scale(1.05)}
.mask img.a{opacity:1;animation:kb 5s ease-out forwards}
@keyframes kb{to{transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){.mask img.a,.heart.on{animation:none}.heart.on{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="hearts"></div>
<canvas id="c"></canvas>
<button id="mu" hidden aria-label="Music on/off" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:20;padding:10px 14px;font-size:20px">🔊</button>

<section id="gate">
  <div class="big">💌</div>
  <p class="serif" style="font-size:26px">Pooja di, there’s a surprise for you…</p>
  <button id="open">Open ✨</button>
</section>

<main>
  <div class="heart" id="heart"><div class="mask" id="mask"></div></div>
  <h1 class="serif cur" id="title"></h1>
  <p class="names" id="names"></p>
  <p class="serif" style="font-size:clamp(18px,4.5vw,26px);margin-top:12px">Happy 1st Wedding Anniversary!</p>
  <p class="date">30 December 💞</p>
  <p class="msg" id="msg"></p>
  <div class="gal" id="gal"></div>
  <p class="foot serif">Always together, forever 💖</p>
</main>

var CAPTIONS = ["Our wedding day", "A special moment", "Haldi fun", "Better together", "A kiss of love", "Festive vibes", "Smiles & love", "Forever & always"];
/* ======================= */

var $=function(i){return document.getElementById(i)};
var song=null;if(AUDIO){song=new Audio(AUDIO);song.loop=true;song.volume=.7;$('mu').hidden=false;$('mu').onclick=function(){if(song.paused){song.play();this.textContent='🔊'}else{song.pause();this.textContent='🔇'}}}
$('names').textContent=NAMES;$('msg').textContent=MESSAGE;

/* floating hearts */
var hs=$('hearts'),E=['💖','💗','💕','❤️','✨'];
setInterval(function(){var d=document.createElement('span');d.className='h';d.textContent=E[Math.floor(Math.random()*E.length)];
d.style.left=Math.random()*100+'vw';d.style.fontSize=(14+Math.random()*22)+'px';
var t=6+Math.random()*6;d.style.animationDuration=t+'s';hs.appendChild(d);setTimeout(function(){d.remove()},t*1000)},450);

/* confetti */
var cv=$('c'),cx=cv.getContext('2d'),P=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
function burst(){for(var i=0;i<140;i++)P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,s:4+Math.random()*6,c:['#f3c969','#ff8fa8','#fff4ec','#ff5c8a'][i%4],l:1})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
P=P.filter(function(p){return p.l>0});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l-=.008;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});
requestAnimationFrame(loop)})();

var mk=$('mask'),imgs=[],cur=0;
PHOTOS.forEach(function(u){var im=document.createElement('img');im.src=u;im.alt='';mk.appendChild(im);imgs.push(im)});
if(imgs.length)imgs[0].classList.add('a');
function next(){if(imgs.length<2)return;imgs[cur].classList.remove('a');cur=(cur+1)%imgs.length;var im=imgs[cur];im.style.animation='none';void im.offsetWidth;im.style.animation='';im.classList.add('a')}
function type(txt,done){var i=0,el=$('title');(function n(){el.textContent=txt.slice(0,++i);if(i<txt.length)setTimeout(n,85);else done()})()}

var g=$('gal'),n=PHOTOS.length||6;
for(var i=0;i<n;i++){var d=document.createElement('div');d.className='pol';
d.style.setProperty('--r',((i%2?1:-1)*(1+Math.random()*3)).toFixed(1)+'deg');
d.innerHTML='<div class="ph">'+(PHOTOS[i]?'<img alt="" src="'+PHOTOS[i]+'">':'📸')+'</div><small>'+(CAPTIONS[i]||'')+'</small>';g.appendChild(d)}

$('open').onclick=function(){
  if(song)song.play().catch(function(){});
  $('gate').classList.add('off');burst();$('heart').classList.add('on');setInterval(next,2600);
  type('Happy 1st Anniversary!',function(){
    $('title').classList.remove('cur');burst();$('msg').classList.add('on');
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.2});
    document.querySelectorAll('.pol').forEach(function(p,i){p.style.transitionDelay=(i%3)*.15+'s';io.observe(p)});
  });
};
</script>
